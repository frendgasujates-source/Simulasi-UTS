<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi UTS Anatomi</title>
    
    <!-- Load React, ReactDOM, and Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* Memastikan scroll bekerja mulus di dalam iframe Google Sites */
        body, html { width: 100%; height: 100%; overflow-x: hidden; }
    </style>
</head>
<body class="bg-teal-50/50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Pengaman LocalStorage untuk Google Sites Iframe Sandbox ---
        const getSavedApiKey = () => {
            try { return window.localStorage.getItem('geminiApiKey') || ''; } 
            catch (e) { return ''; }
        };
        const saveApiKey = (key) => {
            try { window.localStorage.setItem('geminiApiKey', key); } 
            catch (e) { /* Diabaikan jika diblokir iframe */ }
        };

        // --- Data Soal Pilihan Ganda (25 Soal dari Materi) ---
        const pgQuestions = [
            { id: 1, question: "Ilmu yang mempelajari fungsi atau cara kerja dari tiap-tiap jaringan atau organ tubuh manusia disebut...", options: ["Anatomi", "Fisiologi", "Kinesiologi", "Morfologi", "Histologi"], answerIndex: 1, explanation: "Fisiologi (berasal dari kata Fisis dan Logos) adalah ilmu yang mempelajari fungsi atau cara kerja tubuh." },
            { id: 2, question: "Komponen paling banyak di dalam tubuh manusia dewasa adalah air. Berapakah persentase rata-ratanya terhadap total berat badan?", options: ["40%", "50%", "60%", "80%", "90%"], answerIndex: 2, explanation: "Air (H2O) mencapai sekitar 60% (berkisar 50-70%) dari total berat badan orang dewasa." },
            { id: 3, question: "Berapakah jumlah tulang yang menyusun sistem rangka manusia dewasa secara umum?", options: ["126 tulang", "200 tulang", "206 tulang", "250 tulang", "300 tulang"], answerIndex: 2, explanation: "Orang dewasa umumnya memiliki 206 tulang (80 aksial dan 126 apendikular)." },
            { id: 4, question: "Bidang anatomi yang membagi tubuh tepat di tengah menjadi bagian kanan dan kiri disebut...", options: ["Bidang Sagital", "Bidang Koronal", "Bidang Horizontal", "Bidang Median", "Bidang Transversal"], answerIndex: 3, explanation: "Bidang median membagi tubuh tepat di tengah menjadi kanan dan kiri." },
            { id: 5, question: "Istilah anatomi untuk posisi atau letak yang 'lebih dekat dengan pangkal' adalah...", options: ["Distal", "Proksimal", "Superior", "Inferior", "Lateral"], answerIndex: 1, explanation: "Proksimal berarti dekat dengan pangkal (contoh: pangkal lengan/paha), sedangkan Distal berarti jauh dari pangkal." },
            { id: 6, question: "Gerakan memiringkan telapak kaki ke arah dalam tubuh disebut...", options: ["Eversi", "Inversi", "Supinasi", "Pronasi", "Eksorotasi"], answerIndex: 1, explanation: "Inversi adalah memiringkan telapak kaki ke dalam. Eversi memiringkan ke luar." },
            { id: 7, question: "Unit struktural dan fungsional terkecil dari makhluk hidup adalah...", options: ["Jaringan", "Organ", "Sistem Organ", "Organisme", "Sel"], answerIndex: 4, explanation: "Sel adalah unit struktural dan fungsional terkecil penyusun tubuh." },
            { id: 8, question: "Lapisan tulang yang menyusun 80% massa tulang, strukturnya padat, dan memiliki unit bernama Sistem Havers (Osteon) adalah...", options: ["Tulang Spongiosa", "Endosteum", "Tulang Kompakta", "Periosteum", "Sumsum Tulang"], answerIndex: 2, explanation: "Tulang kompakta adalah tulang padat yang menyusun 80% tulang dan memiliki unit fungsional Sistem Havers." },
            { id: 9, question: "Di bawah ini yang BUKAN merupakan bagian dari kerangka Aksial (sumbu tubuh) adalah...", options: ["Tulang Tengkorak", "Tulang Dada (Sternum)", "Tulang Belakang (Vertebralis)", "Tulang Paha (Femur)", "Tulang Rusuk (Kosta)"], answerIndex: 3, explanation: "Tulang paha (femur) adalah bagian dari ekstremitas bawah, yang termasuk dalam kerangka Apendikular (anggota gerak)." },
            { id: 10, question: "Tulang tempurung lutut (Patella) diklasifikasikan berdasarkan bentuknya sebagai tulang...", options: ["Tulang Panjang", "Tulang Pipih", "Tulang Pendek", "Tulang Tidak Beraturan", "Tulang Sesamoid"], answerIndex: 4, explanation: "Patella adalah tulang sesamoid, yaitu tulang bulat kecil yang tertanam pada tendon." },
            { id: 11, question: "Lapisan dinding jantung yang paling tebal dan berupa jaringan otot untuk memompa darah adalah...", options: ["Perikardium", "Epikardium", "Miokardium", "Endokardium", "Mediastinum"], answerIndex: 2, explanation: "Miokardium adalah lapisan otot jantung bagian tengah yang berkontraksi untuk memompa darah." },
            { id: 12, question: "Ruang jantung yang bertugas memompa darah kaya oksigen ke seluruh jaringan tubuh melalui Aorta adalah...", options: ["Atrium Kanan", "Atrium Kiri", "Ventrikel Kanan", "Ventrikel Kiri", "Septum"], answerIndex: 3, explanation: "Ventrikel kiri memompa darah bersih ke seluruh tubuh melawan tekanan sistemik, sehingga dindingnya paling tebal." },
            { id: 13, question: "Katup yang mengatur aliran darah bersih dari serambi kiri (atrium kiri) ke bilik kiri (ventrikel kiri) adalah...", options: ["Katup Trikuspid", "Katup Mitral (Bikuspid)", "Katup Pulmonal", "Katup Aorta", "Katup Semilunar"], answerIndex: 1, explanation: "Katup Mitral (atau Bikuspid) terletak di antara Atrium Kiri dan Ventrikel Kiri." },
            { id: 14, question: "Pembuluh darah yang membawa darah minim oksigen (kotor) dari seluruh tubuh KEMBALI ke jantung adalah...", options: ["Aorta", "Arteri Pulmonalis", "Vena Kava", "Vena Pulmonalis", "Kapiler"], answerIndex: 2, explanation: "Vena kava mengangkut darah kotor dari tubuh kembali ke serambi kanan jantung." },
            { id: 15, question: "Kondisi kelainan di mana terjadi kematian jaringan sel otot jantung (nekrosis) akibat kurangnya pasokan darah disebut...", options: ["Kardiomiopati Dilatasi", "Perikarditis", "Aterosklerosis", "Infark Miokard Akut (IMA)", "Hipertensi"], answerIndex: 3, explanation: "Infark Miokard Akut adalah kematian sel jaringan jantung (serangan jantung) karena berhentinya aliran darah koroner." },
            { id: 16, question: "Golongan obat kardiovaskular yang bekerja memblokir reseptor di jantung untuk mengontrol irama dan mengatasi takikardi adalah...", options: ["ACE Inhibitor", "Beta Blocker", "Diuretik", "Nitrat", "Statin"], answerIndex: 1, explanation: "Beta Blocker menghambat reseptor Beta-1 di jantung untuk memperlambat denyut dan menstabilkan irama." },
            { id: 17, question: "Cairan plasma darah paling banyak didominasi oleh kandungan...", options: ["Protein Albumin", "Sel Darah Merah", "Air", "Natrium Klorida", "Hormon"], answerIndex: 2, explanation: "Plasma darah terdiri dari 91,0% Air." },
            { id: 18, question: "Protein plasma terbanyak yang berfungsi mempertahankan tekanan osmotik dan sangat penting dalam farmakokinetik (mengikat molekul obat seperti warfarin) adalah...", options: ["Globulin", "Fibrinogen", "Hemoglobin", "Albumin", "Protrombin"], answerIndex: 3, explanation: "Albumin adalah protein plasma terbanyak (55-60%) yang berfungsi menahan cairan agar tidak bocor dan mengikat obat." },
            { id: 19, question: "Karena tidak memiliki nukleus, sel darah merah (eritrosit) tidak dapat memperbarui selnya. Berapakah rata-rata masa hidup eritrosit?", options: ["7 hari", "30 hari", "60 hari", "120 hari", "365 hari"], answerIndex: 3, explanation: "Rata-rata umur sel darah merah adalah 120 hari sebelum dihancurkan oleh limpa/hati." },
            { id: 20, question: "Leukosit yang bertindak sebagai respons imun cepat pertama terhadap infeksi dan memiliki jumlah paling banyak (55-70%) adalah...", options: ["Neutrofil", "Limfosit T", "Limfosit B", "Monosit", "Eosinofil"], answerIndex: 0, explanation: "Neutrofil adalah sel darah putih terbanyak dan menjadi garis pertahanan awal melawan infeksi." },
            { id: 21, question: "Dalam proses kaskade pembekuan darah, fragmen sel yang akan berkumpul dan mengeluarkan trombokinase saat terjadi luka adalah...", options: ["Eritrosit", "Leukosit", "Makrofag", "Trombosit (Platelet)", "Fibrinogen"], answerIndex: 3, explanation: "Trombosit (keping darah) bertugas menutup luka awal dan memulai reaksi pembekuan darah." },
            { id: 22, question: "Faktor pembekuan darah nomor IV (Faktor IV) yang sangat penting untuk merubah protrombin menjadi trombin adalah ion...", options: ["Natrium (Na+)", "Kalium (K+)", "Kalsium (Ca2+)", "Besi (Fe2+)", "Klorida (Cl-)"], answerIndex: 2, explanation: "Ion Kalsium (Ca2+) berperan sebagai Faktor IV dalam jalur pembekuan darah." },
            { id: 23, question: "Berdasarkan sistem ABO dan Rhesus, golongan darah yang bertindak sebagai Resipien Universal (dapat menerima dari semua golongan) adalah...", options: ["O-", "O+", "AB-", "AB+", "A+"], answerIndex: 3, explanation: "Golongan AB+ adalah resipien universal karena tidak memiliki antibodi anti-A, anti-B, dan anti-Rh, sehingga bisa menerima darah apapun." },
            { id: 24, question: "Pada pembacaan tekanan darah 120/80 mmHg, angka 120 merepresentasikan...", options: ["Tekanan Diastolik", "Tekanan Sistolik", "Curah Jantung", "Denyut Nadi", "Frekuensi Napas"], answerIndex: 1, explanation: "Angka atas (120) adalah tekanan sistolik, yaitu tekanan saat ventrikel jantung berkontraksi memompa darah." },
            { id: 25, question: "Seseorang dapat didiagnosis menderita Hipertensi apabila tekanan darah istirahatnya secara berlanjut melebihi...", options: ["110/70 mmHg", "120/80 mmHg", "130/85 mmHg", "140/90 mmHg", "160/100 mmHg"], answerIndex: 3, explanation: "Hipertensi ditegakkan jika hasil pengukuran berulang menunjukkan angka > 140/90 mmHg." }
        ];

        // --- Data Soal Esai (5 Soal Komprehensif) ---
        const essayQuestions = [
            { id: 1, question: "Jelaskan definisi dan perbedaan antara ilmu Anatomi dan Fisiologi berdasarkan etimologi (asal kata) dan fokus pembelajarannya!", keyAnswer: "• Anatomi: Berasal dari bahasa Yunani yang berarti 'membuka suatu potongan'. Fokus mempelajari STRUKTUR bagian dalam dan luar tubuh serta hubungannya.\n• Fisiologi: Berasal dari kata 'Fisis' (alam/cara kerja) dan 'Logos' (ilmu). Fokus mempelajari FUNGSI atau cara kerja dari organ/jaringan tersebut." },
            { id: 2, question: "Sebutkan 4 ruang utama pada jantung manusia beserta fungsi fisiologis spesifik dari masing-masing ruang tersebut!", keyAnswer: "1. Atrium Kanan: Menerima darah kotor (kaya CO2) dari seluruh tubuh via vena kava.\n2. Atrium Kiri: Menerima darah bersih (kaya O2) dari paru-paru via vena pulmonalis.\n3. Ventrikel Kanan: Memompa darah kotor menuju paru-paru (via arteri pulmonalis) untuk pertukaran gas.\n4. Ventrikel Kiri: Memompa darah bersih ke seluruh tubuh melalui Aorta (memiliki otot paling tebal karena tekanan sistemik tinggi)." },
            { id: 3, question: "Sistem kardiovaskular memiliki 3 jenis pembuluh darah utama (Arteri, Vena, Kapiler). Jelaskan perbedaan ketiganya secara ringkas!", keyAnswer: "• Arteri: Membawa darah keluar dari jantung, dinding tebal dan elastis (menahan tekanan), mayoritas membawa darah kaya oksigen (kecuali arteri pulmonalis).\n• Vena: Membawa darah kembali ke jantung, dinding lebih tipis, mayoritas membawa darah miskin oksigen (kecuali vena pulmonalis), memiliki katup.\n• Kapiler: Pembuluh mikroskopis, dinding sangat tipis (1 lapis sel), tempat terjadinya pertukaran gas (O2/CO2) dan nutrisi antara darah dan jaringan sel." },
            { id: 4, question: "Jelaskan proses kaskade (skema reaksi) pembekuan darah mulai dari terjadinya luka hingga terbentuknya jaring penutup luka!", keyAnswer: "Saat terjadi luka, Trombosit akan pecah dan mengeluarkan enzim Trombokinase. Trombokinase, dengan bantuan ion Kalsium (Ca2+) dan Vitamin K, akan merubah Protrombin (Faktor II) yang ada di plasma menjadi Trombin. Trombin kemudian mengkatalisis perubahan Fibrinogen (protein terlarut) menjadi benang-benang Fibrin yang solid untuk menjaring sel darah dan menutup luka." },
            { id: 5, question: "Dalam prosedur medis transfusi darah, dikenal istilah Donor Universal dan Resipien Universal. Jelaskan maknanya dan sebutkan golongan darah lengkap (sistem ABO dan Rh) yang mewakili keduanya!", keyAnswer: "• Donor Universal (Golongan Darah O-): Dapat mendonorkan sel darah merah ke SEMUA golongan darah karena eritrositnya tidak memiliki antigen A, antigen B, maupun antigen Rhesus (Rh).\n• Resipien Universal (Golongan Darah AB+): Dapat menerima transfusi darah dari SEMUA golongan karena plasma darahnya tidak memiliki antibodi penolak (anti-A, anti-B) dan sudah memiliki faktor Rhesus positif." }
        ];

        // --- Sub-Komponen Pilihan Ganda ---
        const MultipleChoiceTab = ({ state, setState }) => {
            const { answers, isSubmitted, score, showError } = state;

            const handleOptionChange = (questionId, optionIndex) => {
                if (isSubmitted) return; 
                setState(prev => ({ ...prev, answers: { ...prev.answers, [questionId]: optionIndex }, showError: false }));
            };

            const handleSubmit = () => {
                if (Object.keys(answers).length < pgQuestions.length) {
                    setState(prev => ({ ...prev, showError: true }));
                    return;
                }
                
                let correctCount = 0;
                pgQuestions.forEach(q => { if (answers[q.id] === q.answerIndex) correctCount++; });
                const finalScore = Math.round((correctCount / pgQuestions.length) * 100);
                
                setState(prev => ({ ...prev, isSubmitted: true, score: finalScore, showError: false }));
                document.getElementById('header-title')?.scrollIntoView({ behavior: 'smooth' });
            };

            return (
                <div className="space-y-6">
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-teal-100">
                        <h2 className="text-xl font-bold text-teal-900 border-b border-teal-100 pb-3 mb-4 flex items-center gap-2">
                            <span className="bg-teal-100 text-teal-800 p-1.5 rounded-lg">📝</span>
                            Bagian I: Pilihan Ganda (25 Soal)
                        </h2>
                        <p className="text-gray-600 text-sm md:text-base">Evaluasi pemahaman dasar Anda tentang Sistem Rangka, Jantung, dan Darah. Semua soal wajib diisi sebelum dikumpulkan.</p>
                    </div>

                    {showError && !isSubmitted && (
                        <div className="flex items-center bg-amber-50 border border-amber-200 text-amber-800 p-4 rounded-xl shadow-sm animate-pulse">
                            <span className="mr-3 text-2xl">⚠️</span>
                            <p className="font-semibold text-sm md:text-base">Harap selesaikan seluruh {pgQuestions.length} soal sebelum melihat nilai akhir Anda!</p>
                        </div>
                    )}

                    {isSubmitted && (
                        <div className="bg-gradient-to-br from-teal-600 to-blue-700 text-white p-8 rounded-2xl shadow-lg text-center mb-8 relative overflow-hidden border border-teal-500">
                            <h2 className="text-2xl md:text-3xl font-bold mb-2 relative z-10">Skor Pilihan Ganda Anda</h2>
                            <div className="text-6xl md:text-7xl font-black mb-4 text-emerald-300 relative z-10 drop-shadow-md">
                                {score} <span className="text-2xl md:text-3xl text-teal-100 font-bold">/ 100</span>
                            </div>
                            <p className="text-teal-50 mb-6 font-medium relative z-10 text-lg">
                                Anda menjawab benar {Object.values(answers).filter((val, i) => val === pgQuestions[i].answerIndex).length} dari {pgQuestions.length} soal.
                            </p>
                            <button 
                                onClick={() => setState({ answers: {}, isSubmitted: false, score: 0, showError: false })}
                                className="relative z-10 bg-white text-teal-700 hover:bg-teal-50 font-bold py-3 px-8 rounded-full transition-all shadow-md hover:shadow-lg transform hover:-translate-y-0.5"
                            >
                                Ulangi Kuis PG
                            </button>
                        </div>
                    )}

                    {pgQuestions.map((q, index) => {
                        const userAnswer = answers[q.id];
                        const isCorrect = userAnswer === q.answerIndex;
                        const isAnswered = userAnswer !== undefined;
                        
                        return (
                            <div key={q.id} className={`bg-white p-5 md:p-6 rounded-2xl shadow-sm transition-all duration-300 ${
                                isSubmitted 
                                    ? isCorrect 
                                        ? 'border-2 border-emerald-500 bg-emerald-50/10' 
                                        : 'border-2 border-rose-400 bg-rose-50/10' 
                                    : isAnswered ? 'border-2 border-teal-300 bg-teal-50/30' : 'border border-gray-200'
                            }`}>
                                <div className="flex gap-3 md:gap-4">
                                    <span className={`font-black text-xl shrink-0 ${isSubmitted ? (isCorrect ? 'text-emerald-600' : 'text-rose-600') : 'text-teal-700'}`}>
                                        {String(index + 1).padStart(2, '0')}.
                                    </span>
                                    <div className="flex-1">
                                        <p className="font-semibold text-gray-800 mb-5 text-base md:text-lg leading-relaxed">{q.question}</p>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                            {q.options.map((opt, optIndex) => {
                                                const isSelected = userAnswer === optIndex;
                                                const isCorrectOption = q.answerIndex === optIndex;
                                                
                                                let optionClass = "flex items-center p-3.5 rounded-xl border-2 transition-all duration-200 ";
                                                
                                                if (isSubmitted) {
                                                    if (isCorrectOption) {
                                                        optionClass += "bg-emerald-100 border-emerald-500 text-emerald-900 shadow-sm font-semibold";
                                                    } else if (isSelected && !isCorrectOption) {
                                                        optionClass += "bg-rose-100 border-rose-400 text-rose-900 font-semibold";
                                                    } else {
                                                        optionClass += "bg-gray-50 border-gray-100 opacity-50";
                                                    }
                                                } else {
                                                    optionClass += "cursor-pointer hover:border-teal-400 hover:bg-teal-50 ";
                                                    optionClass += isSelected ? "bg-teal-100 border-teal-500 shadow-sm font-semibold text-teal-900" : "bg-white border-gray-100 text-gray-700";
                                                }

                                                return (
                                                    <label key={optIndex} className={optionClass}>
                                                        <input 
                                                            type="radio" 
                                                            name={`question-${q.id}`} 
                                                            className="sr-only"
                                                            checked={isSelected}
                                                            onChange={() => handleOptionChange(q.id, optIndex)}
                                                            disabled={isSubmitted}
                                                        />
                                                        <div className={`w-5 h-5 rounded-full border-2 mr-3 flex items-center justify-center shrink-0 ${
                                                            isSelected 
                                                                ? isSubmitted 
                                                                    ? isCorrectOption ? 'border-emerald-600 bg-emerald-600' : 'border-rose-600 bg-rose-600'
                                                                    : 'border-teal-600 bg-teal-600'
                                                                : 'border-gray-300 bg-white'
                                                        }`}>
                                                            {isSelected && <div className="w-2 h-2 rounded-full bg-white"></div>}
                                                        </div>
                                                        <span className="flex-1 text-sm md:text-base leading-snug">{opt}</span>
                                                        {isSubmitted && isCorrectOption && <span className="text-emerald-600 ml-2">✅</span>}
                                                        {isSubmitted && isSelected && !isCorrectOption && <span className="text-rose-600 ml-2">❌</span>}
                                                    </label>
                                                )
                                            })}
                                        </div>

                                        {isSubmitted && (
                                            <div className={`mt-5 p-4 rounded-xl text-sm md:text-base ${isCorrect ? 'bg-emerald-50 text-emerald-900 border border-emerald-100' : 'bg-rose-50 text-rose-900 border border-rose-100'}`}>
                                                <h4 className="font-bold flex items-center gap-2 mb-2 pb-2 border-b border-opacity-10 border-black">
                                                    {isCorrect ? "✅ Tepat Sekali!" : "❌ Perlu Ditinjau"}
                                                </h4>
                                                <p className="mt-1"><span className="font-bold">Pembahasan:</span> {q.explanation}</p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        );
                    })}

                    {!isSubmitted && (
                        <div className="flex justify-center mt-10 mb-8 pt-4">
                            <button 
                                onClick={handleSubmit}
                                className="w-full md:w-auto bg-teal-600 hover:bg-teal-700 text-white font-bold py-4 px-12 rounded-full shadow-lg transition-all transform hover:-translate-y-1 hover:shadow-xl text-lg flex items-center justify-center gap-3"
                            >
                                <span>☑️</span>
                                Kumpulkan & Nilai Ujian PG
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        // --- Sub-Komponen Esai ---
        const EssayTab = ({ state, setState, apiKey }) => {
            const { answers, showExplanation, aiResults, isEvaluating, isSubmitted, score, error } = state;

            const handleTextChange = (id, text) => {
                if (isSubmitted) return;
                setState(prev => ({ ...prev, answers: { ...prev.answers, [id]: text } }));
            };

            const toggleExplanation = (id) => {
                setState(prev => ({ ...prev, showExplanation: { ...prev.showExplanation, [id]: !prev.showExplanation[id] } }));
            };

            const evaluateWithAI = async () => {
                if (!apiKey) {
                    setState(prev => ({ ...prev, error: "API Key Gemini kosong! Silakan tempel kode berawalan AQ. di kotak atas." }));
                    document.getElementById('header-title')?.scrollIntoView({ behavior: 'smooth' });
                    return;
                }

                if (Object.keys(answers).length === 0) {
                    setState(prev => ({ ...prev, error: "Silakan isi minimal satu jawaban esai terlebih dahulu." }));
                    return;
                }

                setState(prev => ({ ...prev, isEvaluating: true, error: null }));

                const payload = {
                    contents: [{
                        role: 'user',
                        parts: [{
                            text: `Anda adalah Dosen Anatomi Fisiologi Manusia S1 Farmasi. Evaluasi jawaban mahasiswa berdasarkan kunci jawaban referensi berikut ini. 
                            Berikan nilai (angka 0 hingga 100) dan umpan balik analitis singkat (maksimal 2 kalimat) dalam bahasa Indonesia.
                            
                            \n\nData Ujian:\n` + JSON.stringify(
                                essayQuestions.map(q => ({
                                    id: q.id,
                                    pertanyaan: q.question,
                                    kunci_referensi: q.keyAnswer,
                                    jawaban_mahasiswa: answers[q.id] || "[TIDAK DIJAWAB]"
                                }))
                            )
                        }]
                    }],
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "ARRAY",
                            items: {
                                type: "OBJECT",
                                properties: {
                                    id: { type: "INTEGER", description: "Sesuai dengan ID soal yang dievaluasi" },
                                    score: { type: "INTEGER", description: "Nilai rentang 0-100 berdasarkan kedekatan dengan kunci jawaban" },
                                    feedback: { type: "STRING", description: "Umpan balik analitis dosen berbahasa Indonesia" }
                                },
                                required: ["id", "score", "feedback"]
                            }
                        }
                    }
                };

                try {
                    // Endpoint resmi yang paling stabil untuk eksekusi API JSON
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const result = await response.json();
                    
                    // Menangkap error API spesifik (misal invalid key, quota exceeded, model not found)
                    if (!response.ok) {
                        throw new Error(`Google API Error (${response.status}): ${result.error?.message || response.statusText}`);
                    }

                    if (!result.candidates || result.candidates.length === 0) {
                        throw new Error("API Google tidak mengembalikan hasil. Coba tulis jawaban yang lebih spesifik.");
                    }

                    // Ekstraksi teks dari response
                    let textResponse = result.candidates[0].content.parts[0].text;
                    
                    // Normalisasi pembersihan Markdown yang menyeluruh (menghindari error parsing JSON)
                    textResponse = textResponse.replace(/```json/gi, '').replace(/```/g, '').trim();
                    
                    const parsedResults = JSON.parse(textResponse);
                    const newAiResults = {};
                    let totalScore = 0;

                    parsedResults.forEach(res => {
                        newAiResults[res.id] = res;
                        totalScore += res.score;
                    });
                    
                    const finalEssayScore = Math.round(totalScore / essayQuestions.length);

                    setState(prev => ({
                        ...prev,
                        isEvaluating: false,
                        aiResults: newAiResults,
                        isSubmitted: true,
                        score: finalEssayScore
                    }));
                    document.getElementById('header-title')?.scrollIntoView({ behavior: 'smooth' });
                    
                } catch (err) {
                    console.error("Kesalahan Sistem AI:", err);
                    setState(prev => ({ ...prev, isEvaluating: false, error: err.message || "Gagal memproses parsing dari Google API." }));
                }
            };

            return (
                <div className="space-y-6">
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-cyan-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h2 className="text-xl font-bold text-cyan-900 pb-2 flex items-center gap-2">
                                <span className="bg-cyan-100 text-cyan-800 p-1.5 rounded-lg">📖</span>
                                Bagian II: Esai (5 Soal)
                            </h2>
                            <p className="text-gray-600 text-sm md:text-base">Jawablah dengan bahasa akademis. Gunakan <span className="font-semibold text-cyan-700">Evaluasi AI</span> untuk koreksi otomatis.</p>
                        </div>
                        {!isSubmitted && (
                            <button 
                                onClick={evaluateWithAI}
                                disabled={isEvaluating}
                                className={`flex items-center justify-center py-3 px-6 rounded-full font-bold text-white shadow-md transition-all whitespace-nowrap ${isEvaluating ? 'bg-cyan-400 cursor-wait' : 'bg-cyan-600 hover:bg-cyan-700 hover:shadow-lg transform hover:-translate-y-0.5'}`}
                            >
                                <span className="mr-2">{isEvaluating ? '⏳' : '✨'}</span>
                                {isEvaluating ? 'Menganalisis...' : 'Evaluasi dengan AI'}
                            </button>
                        )}
                    </div>

                    {error && (
                        <div className="flex items-center bg-rose-50 border border-rose-200 text-rose-800 p-4 rounded-xl shadow-sm">
                            <span className="mr-3 text-2xl">⚠️</span>
                            <p className="font-semibold text-sm break-words flex-1">{error}</p>
                        </div>
                    )}

                    {isSubmitted && (
                        <div className="bg-gradient-to-br from-cyan-600 to-blue-800 text-white p-8 rounded-2xl shadow-lg text-center mb-8 relative border border-cyan-400">
                            <h2 className="text-2xl font-bold mb-2">Nilai Analisis Esai</h2>
                            <div className="text-6xl font-black mb-4 text-amber-300 drop-shadow">
                                {score} <span className="text-3xl text-cyan-200">/ 100</span>
                            </div>
                            <p className="text-cyan-50 mb-6 font-medium text-lg">Rata-rata akumulasi dari 5 soal. Baca umpan balik AI di bawah.</p>
                            <button onClick={() => setState({ answers: {}, showExplanation: {}, aiResults: null, isEvaluating: false, isSubmitted: false, score: 0, error: null })} className="bg-white text-cyan-800 font-bold py-3 px-8 rounded-full shadow hover:bg-cyan-50">Tulis Ulang Esai</button>
                        </div>
                    )}

                    {essayQuestions.map((q, index) => {
                        const isShowing = showExplanation[q.id];
                        const aiFeedback = aiResults && aiResults[q.id];
                        
                        return (
                            <div key={q.id} className="bg-white p-5 md:p-7 rounded-2xl shadow-sm border border-gray-200 transition-all hover:border-cyan-300">
                                <div className="flex gap-4 mb-5">
                                    <span className="font-black text-xl text-cyan-700 bg-cyan-50 h-10 w-10 flex items-center justify-center rounded-xl shrink-0">
                                        {index + 1}
                                    </span>
                                    <p className="font-bold text-gray-800 text-base md:text-lg pt-1.5 leading-relaxed">{q.question}</p>
                                </div>
                                
                                <div className="md:ml-14 mb-4 relative">
                                    <textarea
                                        className={`w-full p-4 border-2 rounded-xl focus:ring-4 focus:ring-cyan-500/20 focus:border-cyan-500 outline-none resize-y text-gray-800 bg-gray-50/50 min-h-[140px] text-base leading-relaxed transition-all ${isSubmitted ? 'border-gray-200 bg-gray-100 opacity-80 cursor-not-allowed' : 'border-gray-200 hover:bg-white'}`}
                                        placeholder="Ketik uraian jawaban Anda secara sistematis..."
                                        value={answers[q.id] || ''}
                                        onChange={(e) => handleTextChange(q.id, e.target.value)}
                                        disabled={isSubmitted}
                                    ></textarea>
                                </div>

                                {aiFeedback && (
                                    <div className="md:ml-14 mb-5 bg-gradient-to-r from-blue-50 to-cyan-50 border-l-4 border-l-cyan-500 border border-y-cyan-100 border-r-cyan-100 rounded-r-xl p-5 shadow-sm">
                                        <div className="flex justify-between items-center mb-3">
                                            <h4 className="font-extrabold text-cyan-900 flex items-center gap-2">
                                                🤖 Catatan Dosen AI
                                            </h4>
                                            <span className={`font-black text-lg px-4 py-1 rounded-lg shadow-sm ${aiFeedback.score >= 80 ? 'bg-emerald-100 text-emerald-800' : aiFeedback.score >= 50 ? 'bg-amber-100 text-amber-800' : 'bg-rose-100 text-rose-800'}`}>
                                                Skor: {aiFeedback.score}
                                            </span>
                                        </div>
                                        <p className="text-gray-700 text-sm md:text-base leading-relaxed italic border-t border-cyan-200/50 pt-3">
                                            "{aiFeedback.feedback}"
                                        </p>
                                    </div>
                                )}

                                <div className="md:ml-14">
                                    <button onClick={() => toggleExplanation(q.id)} className="flex items-center gap-2 text-sm font-bold text-gray-500 hover:text-cyan-700 transition-colors">
                                        <span>{isShowing ? '🔼' : '🔽'}</span>
                                        {isShowing ? 'Sembunyikan Referensi' : 'Lihat Kunci Jawaban Referensi'}
                                    </button>
                                    {isShowing && (
                                        <div className="mt-4 p-5 bg-gray-50 border border-gray-200 rounded-xl">
                                            <h4 className="font-bold text-gray-700 mb-2">Kunci Jawaban:</h4>
                                            <p className="text-gray-700 whitespace-pre-line text-sm leading-relaxed">{q.keyAnswer}</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        );
                    })}
                </div>
            );
        };

        // --- Sub-Komponen Hasil Akhir ---
        const DashboardTab = ({ pgScore, essayScore, isPgSubmitted, isEssaySubmitted, setActiveTab }) => {
            const finalScore = Math.round((pgScore + essayScore) / 2);
            const isDone = isPgSubmitted && isEssaySubmitted;

            return (
                <div className="space-y-6 flex justify-center">
                    <div className="bg-white p-8 md:p-12 rounded-3xl shadow-sm border border-gray-100 text-center w-full max-w-3xl">
                        <div className="text-5xl mb-2">📊</div>
                        <h2 className="text-3xl md:text-4xl font-black text-gray-800 mb-3 mt-5 tracking-tight">Kalkulasi Nilai Akhir</h2>
                        <p className="text-gray-500 mb-10 text-lg">Transkrip Simulasi UTS Anatomi Fisiologi Manusia</p>
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
                            <div className="bg-gradient-to-b from-teal-50 to-white border-2 border-teal-100 p-8 rounded-3xl shadow-sm">
                                <h3 className="text-lg font-bold text-teal-800 mb-4 uppercase tracking-wider text-sm">Bagian I (PG)</h3>
                                {isPgSubmitted ? (
                                    <div className="text-6xl font-black text-teal-600">{pgScore}</div>
                                ) : (
                                    <button onClick={() => setActiveTab('pg')} className="bg-teal-600 hover:bg-teal-700 text-white px-6 py-2.5 rounded-full font-bold shadow-md transition-all">Kerjakan PG</button>
                                )}
                            </div>
                            <div className="bg-gradient-to-b from-cyan-50 to-white border-2 border-cyan-100 p-8 rounded-3xl shadow-sm">
                                <h3 className="text-lg font-bold text-cyan-800 mb-4 uppercase tracking-wider text-sm">Bagian II (Esai AI)</h3>
                                {isEssaySubmitted ? (
                                    <div className="text-6xl font-black text-cyan-600">{essayScore}</div>
                                ) : (
                                    <button onClick={() => setActiveTab('esai')} className="bg-cyan-600 hover:bg-cyan-700 text-white px-6 py-2.5 rounded-full font-bold shadow-md transition-all">Kerjakan Esai</button>
                                )}
                            </div>
                        </div>

                        {isDone ? (
                            <div className="bg-gray-900 text-white p-10 rounded-3xl shadow-2xl relative overflow-hidden">
                                <div className="absolute top-0 right-0 w-40 h-40 bg-teal-500 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse"></div>
                                <h3 className="text-xl font-bold mb-4 text-gray-300 uppercase tracking-widest">Skor Kumulatif UTS</h3>
                                <div className="text-8xl font-black mb-6 text-white drop-shadow-lg">{finalScore}</div>
                                <div className="inline-block px-6 py-2 rounded-full bg-white/10 backdrop-blur-sm border border-white/20">
                                    <p className="font-bold text-lg text-teal-300">
                                        {finalScore >= 80 ? "Predikat: A (Sangat Memuaskan) 🌟" : 
                                         finalScore >= 65 ? "Predikat: B (Baik) 📘" : 
                                         finalScore >= 50 ? "Predikat: C (Cukup) ⚠️" : 
                                         "Predikat: D/E (Perlu Remedial) ❌"}
                                    </p>
                                </div>
                            </div>
                        ) : (
                            <div className="bg-gray-50 border border-gray-200 text-gray-600 rounded-2xl p-6 font-medium">
                                Selesaikan kedua modul (Pilihan Ganda & Esai) untuk membuka sertifikat nilai akhir Anda.
                            </div>
                        )}
                    </div>
                </div>
            )
        }

        // --- Komponen Utama Aplikasi ---
        function App() {
            const [activeTab, setActiveTab] = useState('pg');
            const [apiKey, setApiKey] = useState(getSavedApiKey);
            
            const [pgState, setPgState] = useState({ answers: {}, isSubmitted: false, score: 0, showError: false });
            const [essayState, setEssayState] = useState({ answers: {}, showExplanation: {}, aiResults: null, isEvaluating: false, isSubmitted: false, score: 0, error: null });

            return (
                <div className="min-h-screen flex flex-col font-sans bg-teal-50/50" id="header-title">
                    {/* Header: Tema Medis */}
                    <header className="bg-gradient-to-r from-teal-800 to-blue-900 text-white shadow-lg sticky top-0 z-30">
                        <div className="max-w-6xl mx-auto px-4 md:px-8 py-5 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div className="flex items-center gap-4 w-full md:w-auto">
                                <div className="bg-white/20 p-2.5 rounded-xl backdrop-blur-sm hidden md:block text-2xl">
                                    🎓
                                </div>
                                <div>
                                    <h1 className="text-xl md:text-2xl font-black tracking-tight">Simulasi UTS Anatomi Fisiologi</h1>
                                    <p className="text-teal-200 text-xs md:text-sm font-semibold tracking-wide uppercase mt-1">S1 Farmasi • Sistem Rangka, Jantung, Darah</p>
                                </div>
                            </div>
                            <div className="w-full md:w-80 relative">
                                <input 
                                    type="password" 
                                    placeholder="Tempel Gemini API Key di sini..." 
                                    value={apiKey}
                                    onChange={(e) => { 
                                        setApiKey(e.target.value); 
                                        saveApiKey(e.target.value); 
                                    }}
                                    className="w-full bg-black/20 border border-white/30 text-white placeholder-teal-100/70 text-sm rounded-xl focus:ring-2 focus:ring-teal-400 focus:border-transparent focus:bg-black/40 block p-3 outline-none transition-all shadow-inner pl-10"
                                />
                                <div className="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                                    <span>🔑</span>
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto px-4 md:px-8 mt-8 flex-grow w-full">
                        {/* Navigasi Tab */}
                        <div className="flex bg-white p-1.5 rounded-2xl mb-8 shadow-sm border border-teal-100">
                            {[
                                { id: 'pg', label: '1. Pilihan Ganda (25)' },
                                { id: 'esai', label: '2. Esai (AI)' },
                                { id: 'hasil', label: '3. Hasil Akhir' }
                            ].map(tab => (
                                <button 
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`flex-1 py-3 px-2 text-sm md:text-base font-bold rounded-xl transition-all duration-200 ${
                                        activeTab === tab.id 
                                            ? 'bg-teal-600 text-white shadow-md transform scale-100' 
                                            : 'text-gray-500 hover:text-teal-800 hover:bg-teal-50'
                                    }`}
                                >
                                    {tab.label}
                                </button>
                            ))}
                        </div>

                        {/* Konten Halaman */}
                        <div className="pb-20">
                            {activeTab === 'pg' && <MultipleChoiceTab state={pgState} setState={setPgState} />}
                            {activeTab === 'esai' && <EssayTab state={essayState} setState={setEssayState} apiKey={apiKey} />}
                            {activeTab === 'hasil' && <DashboardTab 
                                pgScore={pgState.score} 
                                essayScore={essayState.score} 
                                isPgSubmitted={pgState.isSubmitted} 
                                isEssaySubmitted={essayState.isSubmitted}
                                setActiveTab={setActiveTab}
                            />}
                        </div>
                    </main>

                    <footer className="bg-white border-t border-teal-100 py-6 mt-auto">
                        <div className="max-w-6xl mx-auto px-4 text-center text-teal-800 text-sm font-bold flex items-center justify-center gap-2">
                            <span>🏅</span>
                            <span>Fakultas Farmasi - Simulasi Interaktif & Evaluasi AI</span>
                        </div>
                    </footer>
                </div>
            );
        }

        // --- Render DOM ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
